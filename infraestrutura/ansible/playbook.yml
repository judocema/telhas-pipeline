---
- name: Preparar a VM para rodar o simulador de dados
  hosts: simulador
  become: true

  vars:
    usuario: aluno
    pasta_app: /home/aluno/simulador
    pasta_dados: /home/aluno/dados

  tasks:
    - name: Esperar o cloud-init terminar
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Instalar Python 3 e pip
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Criar a pasta da aplicação
      ansible.builtin.file:
        path: "{{ pasta_app }}"
        state: directory
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
        mode: "0755"

    - name: Criar a pasta dos dados gerados
      ansible.builtin.file:
        path: "{{ pasta_dados }}"
        state: directory
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
        mode: "0755"

